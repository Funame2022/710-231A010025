<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 03 - Đồng hồ đếm ngược</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .timer-hero {
        max-width: 500px;
        margin: 2rem auto;
        background: rgba(20, 20, 20, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 3rem 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-align: center;
      }
      .timer-hero * {
        z-index: 10;
        position: relative;
      }

      .timer-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 2rem;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }

      .clock-face {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 0 auto 2rem;
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        border-radius: 50%;
        box-shadow:
          inset 0 0 30px rgba(0, 0, 0, 0.5),
          0 20px 40px rgba(0, 0, 0, 0.3),
          inset 0 0 0 8px #333;
      }

      .clock-inner {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        bottom: 20px;
        background: #1e1e1e;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      }

      #timerDisplay {
        font-size: 3.5rem;
        font-weight: 800;
        font-family: "Courier New", monospace;
        color: #00ff88;
        line-height: 1;
        text-shadow:
          0 0 20px #00ff88,
          0 0 40px #00ff88,
          0 0 60px #00ff88;
        letter-spacing: 0.05em;
      }

      .timer-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 24px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        min-width: 120px;
      }

      #startBtn {
        background: linear-gradient(45deg, #00ff88, #00cc66);
        color: #000;
        box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
      }

      #pauseBtn,
      #resetBtn {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
      }

      #pauseBtn.active {
        background: linear-gradient(45deg, #ff6b6b, #ee5a52);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .warning #timerDisplay {
        color: #ff4757 !important;
        text-shadow:
          0 0 25px #ff4757,
          0 0 50px #ff4757,
          0 0 75px #ff4757;
      }

      .warning .clock-face {
        animation: warningPulse 1s infinite;
        box-shadow:
          inset 0 0 30px rgba(255, 71, 87, 0.3),
          0 0 30px rgba(255, 71, 87, 0.5),
          0 20px 40px rgba(0, 0, 0, 0.3);
      }

      @keyframes warningPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }

      @media (max-width: 480px) {
        .timer-hero {
          margin: 1rem;
          padding: 2rem 1.5rem;
        }
        .clock-face {
          width: 260px;
          height: 260px;
        }
        #timerDisplay {
          font-size: 3rem;
        }
        .timer-buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="baitap01.html">Bài 01</a></li>
          <li><a href="baitap02.html">Bài 02</a></li>
          <li><a href="baitap03.html">Bài 03</a></li>
          <li><a href="about.html">Lý thuyết</a></li>
          <li><a href="baitap18.html">Bài 18</a></li>
          <li><a href="baitap19.html">Bài 19</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
          <li><a href="diem_danh.html">Điểm danh</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <div class="timer-hero">
        <h1 class="timer-title">Đồng hồ đếm ngược 10 phút</h1>
        <div class="clock-face">
          <div class="clock-inner">
            <div id="timerDisplay">10:00</div>
          </div>
        </div>
        <div class="timer-buttons">
          <button id="startBtn">▶️ Bắt đầu</button>
          <button id="pauseBtn" disabled>⏸️ Tạm dừng</button>
          <button id="resetBtn" disabled>🔄 Đặt lại</button>
        </div>
      </div>
    </main>

    <div id="timeUpFullscreen" class="fullscreen-overlay" style="display: none;">
      <div class="fullscreen-content">
        <div class="timeup-icon">⏰</div>
        <h1 class="timeup-title">HẾT GIỜ!</h1>
        <p class="timeup-message">10 phút đã trôi qua</p>
        <button id="dismissFullscreen" class="dismiss-btn">OK</button>
      </div>
    </div>

    <script src="js/script.js"></script>
    <script>
      let countdownInterval;
      let timeLeft = 10 * 60;
      let isPaused = false;
      const totalTime = 10 * 60;
      let isRunning = false;

      const timerDisplay = document.getElementById("timerDisplay");
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const resetBtn = document.getElementById("resetBtn");
      const fullscreenOverlay = document.getElementById("timeUpFullscreen");
      const dismissBtn = document.getElementById("dismissFullscreen");

      function updateTimer() {
        if (isPaused) return;

        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

        if (timeLeft <= 60) {
          document.querySelector(".timer-hero").classList.add("warning");
        }

        if (timeLeft === 0) {
          clearInterval(countdownInterval);
          isRunning = false;
          startBtn.disabled = false;
          startBtn.textContent = "▶️ Bắt đầu";
          pauseBtn.disabled = true;
          resetBtn.disabled = false;
          fullscreenOverlay.style.display = "flex";
          // Auto-hide after 5 seconds
          setTimeout(() => fullscreenOverlay.style.display = "none", 5000);
        } else {
          timeLeft--;
        }
      }

      function resetTimer() {
        timeLeft = totalTime;
        isPaused = false;
        isRunning = false;
        clearInterval(countdownInterval);

        timerDisplay.textContent = "10:00";
        document.querySelector(".timer-hero").classList.remove("warning");

        startBtn.disabled = false;
        startBtn.textContent = "▶️ Bắt đầu";
        pauseBtn.disabled = true;
        pauseBtn.textContent = "⏸️ Tạm dừng";
        pauseBtn.classList.remove("active");
        resetBtn.disabled = true;
        fullscreenOverlay.style.display = "none";
      }

      startBtn.addEventListener("click", () => {
        if (!isRunning) {
          countdownInterval = setInterval(updateTimer, 1000);
          isRunning = true;
          startBtn.disabled = true;
          startBtn.textContent = "⏹️ Dừng";
          pauseBtn.disabled = false;
          resetBtn.disabled = false;
          updateTimer();
        }
      });

      pauseBtn.addEventListener("click", () => {
        isPaused = !isPaused;
        pauseBtn.classList.toggle("active");
        pauseBtn.textContent = isPaused ? "▶️ Tiếp tục" : "⏸️ Tạm dừng";
      });

      resetBtn.addEventListener("click", resetTimer);
      dismissBtn.addEventListener(
        "click",
        () => (fullscreenOverlay.style.display = "none"),
      );

      fullscreenOverlay.addEventListener("click", (e) => {
        if (e.target === fullscreenOverlay)
          fullscreenOverlay.style.display = "none";
      });

      // ESC to hide
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && fullscreenOverlay.style.display === "flex") {
          fullscreenOverlay.style.display = "none";
        }
      });

      // Fix: Ensure hidden on load
      fullscreenOverlay.style.display = 'none';

      const fullscreenStyle = `
        .fullscreen-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(0,0,0,0.9);
          backdrop-filter: blur(20px);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
        }
        .fullscreen-content {
          background: linear-gradient(135deg, #dc2626, #b91c1c);
          color: white;
          padding: 4rem 3rem;
          border-radius: 24px;
          text-align: center;
          box-shadow: 0 50px 100px rgba(220, 38, 38, 0.5);
          max-width: 500px;
          animation: shake 0.5s ease-in-out;
        }
        .timeup-icon {
          font-size: 6rem;
          margin-bottom: 1rem;
        }
        .timeup-title {
          font-size: 3.5rem;
          font-weight: 900;
          margin-bottom: 1rem;
          text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        .timeup-message {
          font-size: 1.5rem;
          margin-bottom: 2rem;
          opacity: 0.9;
        }
        .dismiss-btn {
          padding: 1rem 3rem;
          font-size: 1.25rem;
          background: white;
          color: #dc2626;
          border: none;
          border-radius: 50px;
          font-weight: 700;
          cursor: pointer;
          transition: all 0.3s;
        }
        .dismiss-btn:hover {
          transform: scale(1.05);
          box-shadow: 0 10px 30px rgba(255,255,255,0.4);
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
          20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
        @media (max-width: 480px) {
          .fullscreen-content { margin: 2rem; padding: 3rem 2rem; }
          .timeup-title { font-size: 2.5rem; }
          .timeup-icon { font-size: 4rem; }
        }
      `;
      const styleSheet = document.createElement("style");
      styleSheet.textContent = fullscreenStyle;
      document.head.appendChild(styleSheet);

      window.addEventListener("beforeunload", () => {
        if (countdownInterval) clearInterval(countdownInterval);
      });
    </script>
  </body>
</html>
