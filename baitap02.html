  </head>
  <body>

      <nav>
        <ul>

          <li><a href="diem_danh.html">Điểm danh</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>FORM ĐĂNG KÝ</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Họ và tên:</label>
          <input type="text" id="fullName" name="fullName" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="password"
            >Mật khẩu (ít nhất 8 ký tự, có chữ hoa/thường/số):</label
          >
          <input type="password" id="password" name="password" required />
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="terms" name="terms" required />
            Đồng ý điều khoản dịch vụ
          </label>
        </div>
        <button type="submit">Đăng ký</button>
      </form>
      <div id="successMsg" class="success-msg" style="display: none"></div>
    </main>

    <script src="js/script.js"></script>
    <script>
      const form = document.getElementById("registerForm");
      const successMsg = document.getElementById("successMsg");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = {
          fullName: utils.sanitizeInput(
            document.getElementById("fullName").value,
          ),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          terms: document.getElementById("terms").checked,
        };

        if (!formData.fullName) {
          alert("Vui lòng nhập họ tên!");
          return;
        }
        if (!utils.isValidEmail(formData.email)) {
          alert("Email không hợp lệ!");
          return;
        }
        if (!utils.isStrongPassword(formData.password)) {
          alert("Mật khẩu phải >=8 ký tự, có chữ hoa, thường và số!");
          return;
        }
        if (!formData.terms) {
          alert("Vui lòng đồng ý điều khoản!");
          return;
        }

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        users.push(formData);
        localStorage.setItem("users", JSON.stringify(users));

        successMsg.innerHTML =
          "Đăng ký thành công! <a href='users.html'>Xem danh sách users</a>";
        successMsg.style.display = "block";
        form.reset();
      });
    </script>
  </body>
</html>
